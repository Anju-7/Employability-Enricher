name: Automated MLOps Pipeline

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Hugging Face Transformers Model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-${{ hashFiles('requirements.txt') }}

      - name: Cache Pip Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install All Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import nltk; nltk.download('punkt'); nltk.download('stopwords'); nltk.download('wordnet')"

      - name: Step 1 - Ingest Incoming Market Data
        run: python fetch_news.py

      - name: Step 2 - Append & Deduplicate Historical Ledger
        run: python history_retrieval.py

      - name: Step 2.5 - Build NLTK Keyword Vectors & Store in DB
        run: python build_keyword_vector_db.py

      - name: Step 3 - Consolidate & Generate Analytics Summaries
        run: python consolidate_market.py

      - name: Step 3.5 - Data Integrity Gate
        run: pytest tests/test_data_integrity.py -v

      - name: Step 4 - Retrain Employability Deep Scorer
        run: python train_model_mlflow.py --epochs 100 --lr 0.005

      - name: Step 5 - Commit Data Updates & Vector Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add todays_market_drift.xml historical_market_intelligence.xml market_summary_analytics.json market_summary_report.md keyword_vectors.npy keyword_metadata.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: publish updated market vector DB & NLTK keyword metadata [skip ci]"
            git push origin main
          fi
        continue-on-error: true

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-vector-db-${{ github.run_id }}
          path: |
            keyword_vectors.npy
            keyword_metadata.json
            market_summary_analytics.json
          retention-days: 30