name: Automated MLOps Pipeline

on:
  schedule:
    - cron: '0 0 * * *'  # Runs automatically every midnight UTC
  workflow_dispatch:      # Enables manual execution via the GitHub Actions UI

# REQUIRED: Enables GITHUB_TOKEN to push updated XML ledgers back to main
permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install All Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Step 1 - Ingest Incoming Market Data
        run: python fetch_news.py

      - name: Step 2 - Append & Deduplicate Historical Ledger
        run: python History_retrieval.py

      - name: Step 3 - Retrain Employability Deep Scorer
        run: python train_model_mlflow.py --epochs 100 --lr 0.005

      - name: Step 4 - Commit Updated Ledgers Back to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add todays_market_drift.xml historical_market_intelligence.xml
          git commit -m "auto: commit dynamic data updates [skip ci]" || exit 0
          git push origin main