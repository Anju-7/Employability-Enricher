name: Automated MLOps Pipeline

on:
  schedule:
    - cron: '0 0 * * *'  # Runs automatically every midnight UTC
  workflow_dispatch:      # Allows manual execution via GitHub UI

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Hugging Face Transformers Model
        uses: actions/cache@v4
        with:
          path: ./hf_cache
          key: ${{ runner.os }}-hf-${{ hashFiles('requirements.txt') }}

      - name: Cache Pip Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install All Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Step 1 - Ingest Incoming Market Data
        run: python fetch_news.py

      - name: Step 2 - Append & Deduplicate Historical Ledger
        run: python History_retrieval.py

      - name: Step 3 - Retrain Employability Deep Scorer
        run: python train_model_mlflow.py --epochs 100 --lr 0.005

      - name: Step 4 - Commit Data Updates to GitHub (Data Files Only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add todays_market_drift.xml historical_market_intelligence.xml 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: publish dynamic market data updates [skip ci]"
            git push origin main
          fi
        continue-on-error: true

      - name: Upload MLflow Artifacts & Model Weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlops-artifacts-run-${{ github.run_id }}
          path: |
            mlruns/
            deep_scorer_weights.pth
          retention-days: 30

      - name: Upload Generated Data Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data-${{ github.run_id }}
          path: |
            todays_market_drift.xml
            historical_market_intelligence.xml
          retention-days: 30